none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px;font:inherit;font-size:12px;font-weight:900;color:var(--ink)}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.result-info{display:flex;justify-content:space-between;align-items:center;margin:15px 1px 9px;font-size:12px;color:var(--muted)}.word-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.word{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:98px}.ko{font-size:20px;font-weight:1000;line-height:1.3}.kana{font-size:12px;font-weight:800;color:var(--blue);margin:4px 0}.jp{font-size:13px;color:var(--muted)}.speak{width:42px;height:42px;border:0;border-radius:7px;background:var(--ink);color:#fff;font-size:17px}.speak.playing{background:var(--red)}.empty{grid-column:1/-1;text-align:center;padding:38px 15px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.note{margin:18px 0 8px;padding:15px;background:#edf4fb;border-left:4px solid var(--blue);font-size:12px;line-height:1.7;color:var(--muted)}.home-link{display:block;margin:14px 0 4px;padding:14px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;text-align:center;font-weight:900}.footer{padding:20px;text-align:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}@media(max-width:600px){.word-list{grid-template-columns:1fr}.content{padding:15px}.hero{padding:27px 18px 21px}.topbar{padding:14px 16px}.search-box{top:72px}}

<body>
  <main class="shell">
    <header class="topbar"><a class="back" href="./" aria-label="ホームに戻る">←</a><div class="brand">韓国語能力試験（TOPIK）対策<small>TOPIK STUDY DESK</small></div></header>
    <section class="hero"><div class="eyebrow">TOPIK I · BASIC VOCABULARY</div><h1>TOPIK I 頻出単語200</h1><p>初級で覚えたい韓国語を10カテゴリに整理しました。韓国語・カタカナ読み・日本語訳を確認し、音声を聞きながら覚えられます。</p><div class="summary"><span>全200語</span><span>10カテゴリ</span><span>音声付き</span><span>完全無料</span></div></section>
    <section class="content">
      <div class="search-box"><input class="search" id="search" type="search" inputmode="search" placeholder="韓国語・読み方・日本語で検索" aria-label="単語を検索"><div class="tabs" id="tabs"></div></div>
      <div class="result-info"><strong id="heading">すべての単語</strong><span id="count">200語</span></div>
      <div class="word-list" id="words"></div>
      <div class="note">音声は端末の韓国語読み上げ機能を利用しています。カタカナ表記は発音の目安として活用してください。</div>
      <a class="home-link" href="./">TOPIK I 学習メニューへ戻る</a>
    </section>
    <footer class="footer">非公式の学習サイトです。TOPIK公式機関とは関係ありません。</footer>
  </main>
  <script src="./vocab.js"></script>
  <script>
    const entries=Object.entries(window.V),all=entries.flatMap(([category,words])=>words.map(word=>({category,word})));let selected='すべて';
    const tabs=document.querySelector('#tabs'),words=document.querySelector('#words'),search=document.querySelector('#search'),heading=document.querySelector('#heading'),count=document.querySelector('#count');
    function speak(text,button){if(!('speechSynthesis'in window)){alert('この端末は音声再生に対応していません');return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='ko-KR';utterance.rate=.78;const voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko'));if(voice)utterance.voice=voice;button.classList.add('playing');utterance.onend=utterance.onerror=()=>button.classList.remove('playing');speechSynthesis.speak(utterance);if(typeof gtag==='function')gtag('event','vocabulary_audio',{word:text})}
    function renderTabs(){tabs.innerHTML='';['すべて',...entries.map(([category])=>category)].forEach(category=>{const button=document.createElement('button');button.className='tab'+(category===selected?' active':'');button.textContent=category;button.onclick=()=>{selected=category;renderTabs();renderWords()};tabs.append(button)})}
    function renderWords(){const query=search.value.trim().toLowerCase();const visible=all.filter(({category,word})=>(selected==='すべて'||category===selected)&&(!query||word.some(value=>value.toLowerCase().includes(query))));heading.textContent=query?'検索結果':selected==='すべて'?'すべての単語':selected;count.textContent=visible.length+'語';words.innerHTML='';if(!visible.length){words.innerHTML='<div class="empty">該当する単語がありません。検索語を変えてみてください。</div>';return}visible.forEach(({word})=>{const row=document.createElement('article');row.className='word';row.innerHTML=`<div><div class="ko" lang="ko">${word[0]}</div><div class="kana">${word[1]}</div><div class="jp">${word[2]}</div></div>`;const button=document.createElement('button');button.className='speak';button.type='button';button.setAttribute('aria-label',word[0]+'の発音を聞く');button.textContent='🔊';button.onclick=()=>speak(word[0],button);row.append(button);words.append(row)})}
    search.addEventListener('input',renderWords);renderTabs();renderWords();
  </script>
  <script src="./site-footer.js"></script>
