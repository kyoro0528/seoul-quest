y-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px}.study-card{position:relative;min-height:165px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.study-card .index{color:var(--muted);font-size:11px;font-weight:900}.study-card .ko{margin-top:9px;font-size:25px;font-weight:1000}.study-card .kana{margin:4px 0;color:var(--blue);font-size:12px;font-weight:900}.study-card .jp{font-size:14px}.study-card .tag{display:inline-block;margin-top:10px;padding:3px 7px;border-radius:20px;background:var(--sky);font-size:10px;color:var(--blue);font-weight:900}.audio{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:var(--navy);color:#fff}.primary{display:block;width:calc(100% - 32px);margin:0 16px 18px;padding:15px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-weight:1000}.quiz-body{padding:20px 16px}.quiz-progress{height:8px;overflow:hidden;border-radius:20px;background:#dbe6ef}.quiz-progress i{display:block;height:100%;background:var(--gold);transition:.25s}.prompt-type{margin-top:20px;color:var(--blue);font-size:11px;font-weight:1000;letter-spacing:.1em}.question{min-height:78px;margin:7px 0 18px;font-size:clamp(26px,7vw,40px);font-weight:1000;line-height:1.4}.question.jpq{font-size:26px}.choices{display:grid;gap:10px}.choice{padding:15px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:900;text-align:left}.choice.correct{border-color:var(--green);background:#e9f8f1;color:#0c6645}.choice.wrong{border-color:var(--red);background:#fff0f1;color:#a51f2a}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#eef4f8}.feedback.show{display:block}.feedback b{font-size:19px}.feedback .meaning{margin-top:5px;color:var(--muted);font-size:13px}.next{display:none;margin-top:12px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:1000}.next.show{display:block}.result{text-align:center;padding:42px 18px 24px}.result-badge{display:grid;place-items:center;width:110px;height:110px;margin:auto;border-radius:50%;background:var(--sky);border:8px solid #cae5ff}.result-badge b{font-size:34px;color:var(--blue)}.result h1{margin:20px 0 5px}.result p{color:var(--muted)}.result-actions{display:grid;gap:10px;margin-top:25px}.result-actions button{padding:14px;border-radius:10px;font:inherit;font-weight:1000}.again{border:0;background:var(--blue);color:#fff}.outline{border:1px solid var(--line);background:#fff;color:var(--ink)}.list-tools{position:sticky;top:72px;z-index:8;padding:14px 16px;background:#f8fafcee;backdrop-filter:blur(10px)}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.word-list{display:grid;gap:8px;padding:0 16px 20px}.word-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.word-row .ko{font-size:19px;font-weight:1000}.word-row small{display:block;color:var(--muted);margin-top:3px}.status{font-size:11px;font-weight:900}.status.weak{color:var(--red)}.status.learned{color:var(--green)}.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,1fr);width:min(100%,780px);padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.nav{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:900}.nav span{display:block;font-size:20px}.nav.active{color:var(--blue)}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:520px){.study-grid{grid-template-columns:1fr}.stats{gap:6px;padding:12px 10px 0}.stat b{font-size:21px}}
    .bottom{grid-template-columns:repeat(2,1fr)}

<body>
<main class="app">
  <header class="topbar"><a class="back" href="./" aria-label="ホームへ戻る">←</a><div class="brand">TOPIK I 単語トレーニング<small>10 WORDS · 10 QUESTIONS</small></div></header>
  <section id="homeView" class="view active">
    <div class="hero"><div class="eyebrow">TOPIK I · 2,000 WORDS & EXPRESSIONS</div><h1>10問ずつ、確実に。</h1><p>1級800語と2級1,200表現を、全200回のミニテストで学習。間違えた問題は「苦手」に入り、あとからまとめて復習できます。</p><div class="progress-wrap"><div class="progress-label"><span>全体の習得</span><span id="overallText">0 / 2000項目</span></div><div class="bar"><i id="overallBar"></i></div></div></div>
    <div class="stats"><div class="stat"><b id="learnedCount">0</b><span>覚えた</span></div><div class="stat"><b id="weakCount">0</b><span>苦手</span></div><div class="stat"><b id="doneCount">0</b><span>完了した回</span></div></div>
    <section class="section"><div class="section-head"><h2>苦手を復習</h2><small>10問</small></div><button class="review" id="reviewButton">苦手な単語を復習する</button></section>
    <section class="section"><div class="section-head"><h2>チャプター</h2><small>100語ずつ</small></div><div class="chapters" id="chapters"></div></section>
  </section>
  <section id="chapterView" class="view"><div class="panel-head"><button class="text-button" data-go="home">← チャプター一覧</button><h1 id="chapterTitle"></h1><p id="chapterSummary"></p></div><div class="lessons" id="lessons"></div></section>
  <section id="quizView" class="view"><div class="quiz-head"><div class="quiz-head-top"><button class="text-button" id="quitQuiz">× 終了</button><span id="quizCount">1 / 10</span></div><h1>10問テスト</h1></div><div class="quiz-body"><div class="quiz-progress"><i id="quizBar"></i></div><div class="prompt-type" id="promptType"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="nextQuestion">次の問題へ</button></div></section>
  <section id="resultView" class="view"><div class="result"><div class="result-badge"><b id="resultScore">0</b></div><h1 id="resultTitle">おつかれさまでした</h1><p id="resultText"></p><div class="result-actions"><button class="again" id="retryWrong">間違えた単語をもう一度</button><button class="outline" id="returnChapter">学習一覧へ戻る</button><button class="outline" data-go="home">ホームへ戻る</button></div></div></section>
  <nav class="bottom"><button class="nav active" data-nav="home"><span>⌂</span>問題を選ぶ</button><button class="nav" data-nav="review"><span>↻</span>苦手を復習</button></nav>
</main>
<script src="./vocab.js"></script>
<script src="./vocab-extra.js"></script>
<script src="./vocab-level2.js"></script>
<script>
const STORE='topikVocabState';
const raw=Object.entries(window.V).flatMap(([category,words])=>words.map(word=>({category,ko:word[0],kana:word[1],jp:word[2]})));
raw.forEach((w,i)=>{w.id='w'+String(i+1).padStart(4,'0');w.level=i<800?'1級':'2級';w.chapter=Math.floor(i/100)+1});
let state=loadState(),currentChapter=1,currentLesson=0,currentWords=[],quiz=[],quizIndex=0,score=0,wrong=[],answered=false,returnMode='chapter';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function loadState(){try{return JSON.parse(localStorage.getItem(STORE))||{words:{},sessions:{}}}catch(e){return{words:{},sessions:{}}}}
function saveState(){localStorage.setItem(STORE,JSON.stringify(state))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function wordState(id){return state.words[id]||{status:'',correct:0,wrong:0}}
function show(id){$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));scrollTo(0,0);$$('.nav').forEach(n=>n.classList.toggle('active',(id==='homeView'&&n.dataset.nav==='home')||(id==='listView'&&n.dataset.nav==='list')))}
function speak(text){if(!('speechSynthesis'in window)){alert('この端末は音声再生に対応していません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.78;const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('ko'));if(v)u.voice=v;speechSynthesis.speak(u);if(typeof gtag==='function')gtag('event','vocabulary_audio',{word:text})}
function renderHome(){const learned=raw.filter(w=>wordState(w.id).status==='learned').length,weak=raw.filter(w=>wordState(w.id).status==='weak').length,done=Object.values(state.sessions).filter(s=>s.completedAt).length;$('#learnedCount').textContent=learned;$('#weakCount').textContent=weak;$('#doneCount').textContent=done;$('#overallText').textContent=learned+' / '+raw.length+'項目';$('#overallBar').style.width=(learned/raw.length*100)+'%';$('#reviewButton').disabled=!weak;$('#reviewButton').textContent=weak?`苦手な問題から10問復習する（${weak}項目）`:'苦手な問題はまだありません';const box=$('#chapters'),availableChapters=Math.ceil(raw.length/100);box.innerHTML='';for(let c=1;c<=20;c++){const available=c<=availableChapters,learnedIn=raw.filter(w=>w.chapter===c&&wordState(w.id).status==='learned').length,b=document.createElement('button');b.className='chapter';b.disabled=!available;b.innerHTML=`<span class="chapter-num">${c}</span><span><b>Chapter ${c} · ${c<=8?'1級':'2級'}</b><small>${available?`${learnedIn} / 100項目 習得`:'準備中'}</small></span><span class="chev">${available?'›':'−'}</span>`;if(available)b.onclick=()=>openChapter(c);box.append(b)}}
function openChapter(c){currentChapter=c;$('#chapterTitle').textContent=`Chapter ${c}`;$('#chapterSummary').textContent=`TOPIK ${c<=8?'1級の基本単語':'2級の実用表現'}100項目 · 10回に分けて学習`;const box=$('#lessons');box.innerHTML='';for(let i=0;i<10;i++){const key=`c${c}l${i}`,s=state.sessions[key],b=document.createElement('button');b.className='lesson'+(s&&s.completedAt?' done':'');b.innerHTML=`<span class="lesson-no">${s&&s.completedAt?'✓':i+1}</span><span><b>第${i+1}回</b><small>${i*10+1}〜${i*10+10}問</small></span><span class="best">${s?`最高 ${s.best}/10`:''}</span>`;b.onclick=()=>startStudy(c,i);box.append(b)}show('chapterView')}
function lessonWords(c,l){return raw.slice((c-1)*100+l*10,(c-1)*100+l*10+10)}
function startStudy(c,l){currentChapter=c;currentLesson=l;currentWords=lessonWords(c,l);beginQuiz(currentWords,'chapter')}
function makeQuiz(words){const pool=raw;return shuffle(words).map((w,i)=>{let type=i<6?'ko-jp':i<8?'jp-ko':'audio-jp';const field=type==='jp-ko'?'ko':'jp',answer=w[field],others=shuffle(pool.filter(x=>x.id!==w.id&&x[field]!==answer)).slice(0,3).map(x=>x[field]);return{w,type,answer,choices:shuffle([answer,...others])}})}
function beginQuiz(words,mode='chapter'){currentWords=[...words];quiz=makeQuiz(words);quizIndex=0;score=0;wrong=[];returnMode=mode;renderQuestion();show('quizView');if(typeof gtag==='function')gtag('event','vocabulary_quiz_start',{mode})}
function renderQuestion(){answered=false;const q=quiz[quizIndex];$('#quizCount').textContent=`${quizIndex+1} / ${quiz.length}`;$('#quizBar').style.width=(quizIndex/quiz.length*100)+'%';$('#feedback').className='feedback';$('#nextQuestion').className='next';const question=$('#question');question.className='question';if(q.type==='ko-jp'){ $('#promptType').textContent='韓国語に合う日本語は？';question.textContent=q.w.ko}else if(q.type==='jp-ko'){ $('#promptType').textContent='日本語に合う韓国語は？';question.textContent=q.w.jp;question.classList.add('jpq')}else{$('#promptType').textContent='音声に合う日本語は？';question.innerHTML='<button class="primary" style="margin:0;width:100%">🔊 音声を聞く</button>';question.querySelector('button').onclick=()=>speak(q.w.ko);setTimeout(()=>speak(q.w.ko),250)}const choices=$('#choices');choices.innerHTML='';q.choices.forEach(text=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>answer(b,text);choices.append(b)})}
function answer(button,text){if(answered)return;answered=true;const q=quiz[quizIndex],ok=text===q.answer,ws=wordState(q.w.id);ws.last=Date.now();if(ok){score++;ws.correct=(ws.correct||0)+1;ws.status='learned'}else{ws.wrong=(ws.wrong||0)+1;ws.status='weak';wrong.push(q.w)}state.words[q.w.id]=ws;saveState();$$('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});if(!ok)button.classList.add('wrong');const f=$('#feedback');f.className='feedback show';f.innerHTML=`<b>${ok?'正解！':'不正解'}</b><div class="meaning"><span lang="ko">${q.w.ko}</span>（${q.w.kana}）＝ ${q.w.jp}</div>`;$('#nextQuestion').textContent=quizIndex===quiz.length-1?'結果を見る':'次の問題へ';$('#nextQuestion').className='next show';if(q.type==='audio-jp'||!ok)speak(q.w.ko)}
function nextQuestion(){quizIndex++;if(quizIndex<quiz.length){renderQuestion();return}finishQuiz()}
function finishQuiz(){if(returnMode==='chapter'){const key=`c${currentChapter}l${currentLesson}`,old=state.sessions[key]||{best:0};state.sessions[key]={best:Math.max(old.best,score),last:score,completedAt:Date.now()};saveState()}$('#resultScore').textContent=`${score}/${quiz.length}`;$('#resultTitle').textContent=score===quiz.length?'全問正解！':score>=8?'よくできました！':'苦手を復習しましょう';$('#resultText').textContent=`正解 ${score}問・不正解 ${quiz.length-score}問。間違えた単語は「苦手」に記録しました。`;$('#retryWrong').style.display=wrong.length?'block':'none';renderHome();show('resultView');if(typeof gtag==='function')gtag('event','vocabulary_quiz_complete',{score,total:quiz.length,mode:returnMode})}
function reviewWords(){const weak=raw.filter(w=>wordState(w.id).status==='weak'),selected=shuffle(weak).slice(0,10),fill=shuffle(raw.filter(w=>!selected.some(x=>x.id===w.id))).slice(0,10-selected.length);return [...selected,...fill]}
function startReview(){const weak=raw.filter(w=>wordState(w.id).status==='weak');if(!weak.length){alert('苦手な単語はまだありません。まずチャプター学習を始めましょう。');return}beginQuiz(reviewWords(),'review')}
function renderList(){const q=$('#search').value.trim().toLowerCase(),visible=raw.filter(w=>!q||[w.ko,w.kana,w.jp,w.category,w.level].some(x=>x.toLowerCase().includes(q)));const box=$('#wordList');box.innerHTML='';visible.forEach(w=>{const s=wordState(w.id),row=document.createElement('button');row.className='word-row';row.innerHTML=`<span><span class="ko" lang="ko">${w.ko}</span><small>${w.kana} · ${w.jp}<br>${w.level} · ${w.category}</small></span><span class="status ${s.status}">${s.status==='learned'?'覚えた':s.status==='weak'?'苦手':'未学習'}</span>`;row.onclick=()=>speak(w.ko);box.append(row)});if(!visible.length)box.innerHTML='<div class="empty">該当する単語がありません。</div>'}
$$('[data-go="home"]').forEach(b=>b.onclick=()=>{renderHome();show('homeView')});$('#reviewButton').onclick=startReview;$('#quitQuiz').onclick=()=>{if(confirm('テストを終了しますか？')){renderHome();show('homeView')}};$('#nextQuestion').onclick=nextQuestion;$('#retryWrong').onclick=()=>{const selected=[...wrong],fill=shuffle(currentWords.filter(w=>!selected.some(x=>x.id===w.id))).slice(0,10-selected.length);beginQuiz([...selected,...fill],'retry')};$('#returnChapter').onclick=()=>returnMode==='chapter'?openChapter(currentChapter):(renderHome(),show('homeView'));$$('[data-nav]').forEach(b=>b.onclick=()=>b.dataset.nav==='home'?(renderHome(),show('homeView')):startReview());renderHome();
</script>
