</main></div><script type="text/plain" data-learning-app>
const Q=[["r01","문을 닫아 주세요.","何をしなければなりませんか。","문을 닫습니다.",["문을 엽니다.","문을 닫습니다.","밖에 나갑니다.","불을 켭니다."],"ドアを閉めてください。","닫아 주세요は「閉めてください」。正解は「ドアを閉めます」です。엽니다は「開けます」、나갑니다は「出ます」、켭니다は「つけます」で、どれも닫다の動作と異なります。"],["r02","오늘은 쉽니다.","正しいものを選んでください。","오늘은 일을 하지 않습니다.",["오늘은 일을 합니다.","오늘은 일을 하지 않습니다.","내일은 쉽니다.","매일 쉽니다."],"今日は休みます。","오늘은「今日は」、쉽니다は「休みます」。したがって今日は仕事をしないという選択肢が正解です。仕事をする、明日休む、毎日休むとは書かれていません。"],["r03","[화장실] 2층","正しいものを選んでください。","화장실은 이 층에 있습니다.",["화장실은 일 층에 있습니다.","화장실은 이 층에 있습니다.","화장실이 없습니다.","화장실은 밖에 있습니다."],"［トイレ］2階","화장실は「トイレ」、2층と이 층は「2階」です。1階、屋外、トイレがないという記述は案内にありません。"],["r04","우유 2,000원\n물 1,000원","正しいものを選んでください。","물이 우유보다 쌉니다.",["우유가 더 쌉니다.","물이 우유보다 쌉니다.","가격이 같습니다.","물은 이천 원입니다."],"牛乳2,000ウォン、水1,000ウォン。","水は1,000ウォン、牛乳は2,000ウォンなので水のほうが安いです。牛乳が安い、同じ値段、水が2,000ウォンという選択肢は数字と合いません。"],["r05","수업: 월요일 오전 10시","授業はいつですか。","월요일 오전 열 시입니다.",["화요일 오전 열 시입니다.","월요일 오후 열 시입니다.","월요일 오전 열 시입니다.","일요일 오전 열 시입니다."],"授業：月曜日午前10時。","월요일は「月曜日」、오전 10시は「午前10時」です。ほかの選択肢は曜日または午前・午後が案内と異なります。"],["r06","비가 옵니다. 우산을 가져가세요.","正しいものを選んでください。","우산이 필요합니다.",["날씨가 맑습니다.","우산이 필요합니다.","눈이 옵니다.","비가 오지 않습니다."],"雨が降っています。傘を持って行ってください。","비가 옵니다は「雨が降っています」、우산을 가져가세요は「傘を持って行ってください」。晴れ、雪、雨が降っていないという選択肢は本文に反します。"],["r07","도서관에서는 조용히 하세요.","正しいものを選んでください。","큰 소리로 이야기하면 안 됩니다.",["노래를 불러도 됩니다.","큰 소리로 이야기하면 안 됩니다.","음식을 많이 먹습니다.","사진을 찍어야 합니다."],"図書館では静かにしてください。","조용히 하세요は「静かにしてください」。大声で話してはいけない、が正解です。歌う、食事する、写真を撮るという選択肢は、この指示の意味を表していません。"],["r08","민수 씨, 저는 먼저 집에 갑니다. 내일 만나요. -유키","正しいものを選んでください。","유키 씨는 집에 갑니다.",["민수 씨가 집에 갑니다.","유키 씨는 집에 갑니다.","유키 씨는 오늘 부산에 갑니다.","유키 씨는 회사에 갑니다."],"ミンスさん、私は先に帰宅します。明日会いましょう。－ユキ","「저는 먼저 집에 갑니다（私は先に家に帰ります）」と書いたのは署名にあるユキです。ミンスが帰る、ユキが釜山や会社に行くとは書かれていません。"],["r09","[영업시간]\n09:00~18:00","正しいものを選んでください。","오후 여섯 시에 문을 닫습니다.",["오전 여섯 시에 엽니다.","오후 여섯 시에 문을 닫습니다.","아홉 시간 쉽니다.","밤에도 문을 엽니다."],"営業時間9時〜18時。","영업시간は「営業時間」。09:00に開き18:00、つまり午後6時に閉まります。午前6時に開く、9時間休む、夜も営業するという情報はありません。"],["r10","주차 금지","意味として正しいものを選んでください。","차를 세우면 안 됩니다.",["차를 세워도 됩니다.","차를 세우면 안 됩니다.","차를 사야 합니다.","버스를 타면 안 됩니다."],"駐車禁止。","주차は「駐車」、금지は「禁止」です。車を止めてはいけません。駐車可能、車を買う、バスに乗ることを禁じる、という意味ではありません。"],["r11","저는 아침마다 공원에서 운동합니다.","正しいものを選んでください。","매일 아침 운동합니다.",["저녁에 운동합니다.","매일 아침 운동합니다.","학교에서 운동합니다.","운동을 싫어합니다."],"私は毎朝、公園で運動します。","아침마다は「毎朝」、공원에서は「公園で」。毎朝運動するのが正解です。夕方や学校で運動すること、運動が嫌いなことは書かれていません。"],["r12","김밥은 3,000원이고 라면은 4,500원입니다.","正しいものを選んでください。","김밥이 라면보다 쌉니다.",["라면이 더 쌉니다.","김밥이 라면보다 쌉니다.","가격이 같습니다.","김밥은 사천 원입니다."],"キンパは3,000ウォン、ラーメンは4,500ウォンです。","キンパ3,000ウォンはラーメン4,500ウォンより1,500ウォン安いです。ラーメンが安い、同額、キンパが4,000ウォンという選択肢は価格と一致しません。"],["r13","회의가 금요일에서 목요일로 바뀌었습니다.","正しいものを選んでください。","회의는 목요일에 합니다.",["회의는 금요일에 합니다.","회의는 목요일에 합니다.","회의가 없어졌습니다.","회의는 주말입니다."],"会議が金曜日から木曜日に変わりました。","금요일에서 목요일로 바뀌었습니다は「金曜日から木曜日に変わりました」。変更後は木曜日です。金曜日のまま、中止、週末という意味ではありません。"],["r14","서울역에 가는 버스는 10분마다 옵니다.","正しいものを選んでください。","버스는 십 분마다 옵니다.",["버스는 한 시간마다 옵니다.","버스는 십 분마다 옵니다.","기차가 십 분마다 옵니다.","버스는 부산에 갑니다."],"ソウル駅行きのバスは10分ごとに来ます。","서울역에 가는 버스は「ソウル駅行きのバス」、10분마다は「10分ごとに」。1時間ごと、列車が来る、釜山行きという選択肢は本文と異なります。"],["r15","[가을 세일]\n9월 20일~30일\n모든 옷 30% 할인","正しいものを選んでください。","구월에 옷을 싸게 살 수 있습니다.",["팔월에 세일합니다.","구월에 옷을 싸게 살 수 있습니다.","신발만 할인합니다.","하루만 세일합니다."],"秋のセール。9月20〜30日。すべての服30％割引。","9월 20일~30일は「9月20日から30日」、모든 옷 30% 할인は「すべての服が30％引き」。8月、靴だけ、1日だけという選択肢は案内と違います。"],["r16","오늘 친구와 한강에 갔습니다. 자전거를 타고 사진도 찍었습니다.","正しいものを選んでください。","친구와 자전거를 탔습니다.",["혼자 갔습니다.","자전거를 샀습니다.","친구와 자전거를 탔습니다.","사진을 찍지 않았습니다."],"今日、友達と漢江へ行き、自転車に乗って写真も撮りました。","친구와 한강에 갔습니다（友達と漢江に行きました）、자전거를 탔습니다（自転車に乗りました）が根拠です。一人で行った、自転車を買った、写真を撮らなかったという選択肢は本文と異なります。"],["r17","감기에 걸렸습니다. 그래서 오늘 회사에 가지 못합니다.","正しいものを選んでください。","아파서 회사에 못 갑니다.",["회사에서 감기에 걸렸습니다.","아파서 회사에 못 갑니다.","오늘 회사에 갑니다.","회사를 그만둡니다."],"風邪をひきました。だから今日は会社へ行けません。","감기에 걸렸습니다は「風邪をひきました」、그래서は「それで」。体調が悪く会社に行けません。職場で感染した、出勤した、退職したとは書かれていません。"],["r18","토요일에 등산을 가려고 합니다. 비가 오면 집에서 영화를 볼 겁니다.","正しいものを選んでください。","날씨에 따라 계획이 바뀝니다.",["비가 와도 등산합니다.","토요일에 일합니다.","날씨에 따라 계획이 바뀝니다.","영화관에 갑니다."],"土曜日に登山する予定です。雨なら家で映画を見ます。","토요일에 등산を予定していますが、비가 오면「雨が降ったら」家で映画を見ます。雨でも登山する、土曜に働く、映画館へ行くという選択肢は本文に反します。"],["r19","책을 빌린 분은 5월 10일까지 돌려주세요.","正しいものを選んでください。","오월 십 일까지 책을 반납해야 합니다.",["오월 십 일에 책을 빌립니다.","책을 사야 합니다.","오월 십 일까지 책을 반납해야 합니다.","책을 읽으면 안 됩니다."],"本を借りた方は5月10日までに返してください。","5월 10일까지は「5月10日までに」、돌려주세요は「返してください」。本の返却期限が正解です。10日に借りる、本を買う、読むのを禁じるとは書かれていません。"],["r20","수진 씨의 생일 선물을 사려고 백화점에 갔지만 마음에 드는 것이 없어서 선물을 사지 않았습니다.","正しいものを選んでください。","선물을 사지 않았습니다.",["생일 선물을 샀습니다.","선물을 사지 않았습니다.","수진 씨와 갔습니다.","백화점이 문을 닫았습니다."],"スジンさんの誕生日プレゼントを買いに百貨店へ行きましたが、気に入る物がなかったので買いませんでした。","마음에 드는 것이 없어서「気に入る物がなかったので」、선물을 사지 않았습니다「プレゼントを買いませんでした」と明記されています。買った、スジンと行った、百貨店が閉まっていたという記述はありません。"],["r21","[모집]\n한국어 회화 모임\n매주 수요일 19:00\n참가비 무료","正しいものを選んでください。","돈을 내지 않아도 됩니다.",["화요일에 모입니다.","아침에 시작합니다.","돈을 내지 않아도 됩니다.","영어를 공부합니다."],"韓国語会話の集まり。毎週水曜19時。参加費無料。","참가비 무료は「参加費無料」なので、お金を払う必要はありません。集まりは水曜19時からで、学ぶのは韓国語です。火曜、朝、英語という選択肢は案内と違います。"],["r22","택배가 왔습니다. 집에 안 계셔서 경비실에 맡겼습니다.","荷物はどこにありますか。","경비실에 있습니다.",["우체국에 있습니다.","집 앞에 있습니다.","경비실에 있습니다.","회사에 있습니다."],"宅配便が来ました。ご不在だったので管理人室に預けました。","집에 안 계셔서は「ご不在だったので」、경비실에 맡겼습니다は「管理人室に預けました」。郵便局、家の前、会社という場所は書かれていません。"],["r23","저는 요리를 잘 못했지만 요즘 매일 저녁을 만들고 있습니다. 조금씩 재미있어집니다.","正しいものを選んでください。","요즘 요리가 조금씩 재미있어집니다.",["요리를 그만두었습니다.","매일 식당에 갑니다.","요즘 요리가 조금씩 재미있어집니다.","아침만 만듭니다."],"料理が苦手でしたが、最近毎晩作っています。少しずつ楽しくなっています。","요즘 매일 저녁을 만들고 있습니다「最近毎晩作っています」、조금씩 재미있어집니다「少しずつ楽しくなっています」が根拠です。料理をやめた、毎日外食する、朝だけ作るという選択肢は本文と違います。"],["r24","앞문 공사 때문에 이번 주에는 앞문을 사용할 수 없습니다. 뒷문을 이용해 주세요.","正しいものを選んでください。","이번 주에는 앞문을 사용할 수 없습니다.",["항상 뒷문만 씁니다.","이번 주에는 앞문을 사용할 수 없습니다.","공사가 끝났습니다.","문을 모두 닫습니다."],"正面入口の工事のため、今週は正面入口を使えません。裏口をご利用ください。","이번 주에는 앞문을 사용할 수 없습니다「今週は正面入口を使えません」と明記されています。いつも裏口を使う、工事が終わった、すべての入口が閉まったという意味ではありません。"],["r25","지하철이 고장 나서 약속 시간에 늦었습니다.","遅れた理由は何ですか。","지하철에 문제가 있었습니다.",["늦게 일어났습니다.","길을 몰랐습니다.","지하철에 문제가 있었습니다.","약속을 잊었습니다."],"地下鉄が故障して約束の時間に遅れました。","지하철이 고장 나서は「地下鉄が故障したので」。遅れた理由は地下鉄のトラブルです。寝坊、道に迷った、約束を忘れたとは書かれていません。"],["r26","새로 이사한 집은 회사에서 가깝고 방도 넓습니다. 하지만 근처에 가게가 별로 없습니다.","正しいものを選んでください。","집 근처에 가게가 많지 않습니다.",["회사가 멉니다.","방이 좁습니다.","집 근처에 가게가 많지 않습니다.","이사하지 않았습니다."],"新居は会社に近く部屋も広いですが、近所に店があまりありません。","근처에 가게가 별로 없습니다は「近所に店があまりありません」。会社は近く、部屋は広く、すでに引っ越しています。ほかの選択肢はこれらの情報と反対です。"],["r27","영화는 일곱 시에 시작합니다. 표는 시작하기 삼십 분 전부터 살 수 있습니다.","何時からチケットを買えますか。","여섯 시 삼십 분부터 살 수 있습니다.",["여섯 시부터","여섯 시 삼십 분부터 살 수 있습니다.","일곱 시 삼십 분부터","여덟 시부터"],"映画は7時に始まります。チケットは開始30分前から買えます。","映画の開始は7時。삼십 분 전부터は「30分前から」なので、6時30分から買えます。6時、7時30分、8時はいずれも30分前ではありません。"],["r28","작은 여행 가방은 가볍지만 물건이 많이 들어가지 않습니다. 큰 가방은 무겁지만 물건을 많이 넣을 수 있습니다.","正しいものを選んでください。","두 가방은 각각 장점과 단점이 있습니다.",["작은 가방이 무겁습니다.","큰 가방에는 적게 들어갑니다.","두 가방은 각각 장점과 단점이 있습니다.","두 가방의 크기가 같습니다."],"小さい旅行かばんは軽いですが、物があまり入りません。大きいかばんは重いですが、物をたくさん入れられます。","小さいかばんは軽さ、大きいかばんは収納量が利点です。一方で容量の少なさと重さがそれぞれ欠点です。小さいほうが重い、大きいほうが少量しか入らない、同じ大きさという選択肢は本文と違います。"],["r29","건강을 위해 버스에서 한 정거장 먼저 내려서 걸어 다닙니다.","この人はなぜ歩きますか。","건강을 위해 걷습니다.",["버스를 싫어해서","길을 잃어서","건강을 위해 걷습니다.","돈이 없어서"],"健康のため、バスを一つ前の停留所で降りて歩きます。","건강을 위해は「健康のために」です。歩く目的は健康を保つことです。バスが嫌い、道に迷った、お金がないという理由は本文にありません。"],["r30","처음에는 한국어 뉴스가 너무 빨라서 이해하지 못했습니다. 매일 들으니까 이제 중요한 내용은 알 수 있습니다.","正しいものを選んでください。","계속 연습해서 듣기 실력이 좋아졌습니다.",["뉴스를 듣지 않습니다.","한국어가 더 어려워졌습니다.","계속 연습해서 듣기 실력이 좋아졌습니다.","처음부터 모두 이해했습니다."],"最初は韓国語ニュースが速く理解できませんでしたが、毎日聞いて今は重要な内容が分かります。","처음에는 이해하지 못했습니다「初めは理解できませんでした」が、매일 들으니까「毎日聞いていたら」重要な内容が分かるようになりました。聞いていない、さらに難しくなった、最初から全部分かったという選択肢は本文と反対です。"]];
function validateQuestions(items){const ids=new Set(),errors=[];for(const x of items){if(ids.has(x[0]))errors.push(`${x[0]}: ID重複`);ids.add(x[0]);if(x.length!==7||x.slice(0,4).some(v=>!v)||!x[5]||!x[6])errors.push(`${x[0]}: 必須項目不足`);if(!Array.isArray(x[4])||x[4].length!==4||new Set(x[4]).size!==4||!x[4].includes(x[3]))errors.push(`${x[0]}: 選択肢・正解不整合`)}if(items.length!==30)errors.push(`問題数: ${items.length}`);return errors}const QUESTION_ERRORS=validateQuestions(Q);if(QUESTION_ERRORS.length)console.error("読解問題データの検査エラー",QUESTION_ERRORS);
Q.forEach((x,i)=>{x.level=i<14?'1級':'2級';x.difficulty=i<8?'基礎':i<20?'標準':'応用'});const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let queue=[],pos=0,score=0,answered=false,wrong=new Set(),mode='all';function saved(){try{return new Set(JSON.parse(localStorage.getItem('topikReadingWrong')||'[]'))}catch{return new Set()}}function save(){localStorage.setItem('topikReadingWrong',JSON.stringify([...wrong]))}function send(n,p={}){if(typeof gtag==='function')gtag('event',n,p)}function selected(){return Q.filter(x=>($('#level').value==='すべて'||x.level===$('#level').value)&&($('#difficulty').value==='すべて'||x.difficulty===$('#difficulty').value))}function update(){const n=selected().length;$('#count').textContent=`${n}問が対象です`;$('#start').textContent=`${n}問を始める`;const w=saved().size;$('#review').textContent=w?`間違いを復習（${w}問）`:'間違いを復習';$('#review').disabled=!w}function begin(review=false){wrong=saved();queue=(review?Q.filter(x=>wrong.has(x[0])):selected()).map(x=>({...x,shown:shuffle(x[4])}));if(!queue.length)return;mode=review?'review':'all';pos=score=0;$('#intro').style.display='none';$('#result').classList.remove('show');$('#quiz').classList.add('show');send(review?'reading_review_start':'reading_start',{question_count:queue.length});send('practice_start',{practice_type:'reading',practice_mode:mode,content_id:'topik1_reading',question_count:queue.length});render()}function render(){answered=false;const x=queue[pos];$('#tag').textContent=`${x.level} · 読解 · ${x.difficulty}`;$('#counter').textContent=`${pos+1} / ${queue.length}`;$('#bar').style.width=`${pos/queue.length*100}%`;$('#inst').textContent=x[2];$('#reportQuestion').href='https://github.com/kyoro0528/seoul-quest/issues/new?'+new URLSearchParams({title:`読解問題 ${x[0]} の誤り`,body:`問題ID: ${x[0]}\n問題文: ${x[1]}\n正解: ${x[3]}\nページ: ${location.href}\n\n修正内容: `});$('#question').textContent=x[1];$('#options').innerHTML='';x.shown.forEach(v=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>answer(b,v);$('#options').append(b)});$('#feedback').className='feedback';$('#next').disabled=true;$('#next').textContent=pos===queue.length-1?'結果を見る':'次の問題へ'}function answer(btn,v){if(answered)return;answered=true;const x=queue[pos],ok=v===x[3];TopikLearningStorage.recordAnswer(ok);if(ok){score++;wrong.delete(x[0])}else wrong.add(x[0]);save();[...$('#options').children].forEach(b=>{b.disabled=true;if(b.textContent===x[3])b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')});$('#judge').textContent=ok?'正解！':'不正解';$('#jp').textContent=`日本語：${x[5]}`;$('#explain').textContent=x[6];$('#feedback').className='feedback show'+(ok?'':' bad');$('#next').disabled=false;send('reading_answer',{question_id:x[0],topik_level:x.level,difficulty:x.difficulty,correct:ok});send('question_answer',{practice_type:'reading',practice_mode:mode,question_id:x[0],question_number:pos+1,answer_result:ok?'correct':'incorrect'})}function finish(){save();$('#quiz').classList.remove('show');$('#result').classList.add('show');const total=queue.length,rate=Math.round(score/total*100);$('#score').textContent=score;$('#total').textContent=` / ${total}`;$('#resultTitle').textContent=rate>=80?'よく読めています！':rate>=60?'あと一歩です':'基礎から復習しましょう';$('#resultText').textContent=`正答率${rate}%です。間違えた問題はこの端末に保存しました。`;$('#resultReview').disabled=!wrong.size;send('reading_complete',{practice_mode:mode,score,question_count:total,score_rate:rate});const result={practice_type:'reading',practice_mode:mode,score,question_count:total,score_rate:rate};send('practice_complete',result);if(total===10)send('ten_questions_complete',result)}$('#start').onclick=()=>begin(false);$('#review').onclick=$('#resultReview').onclick=()=>begin(true);$('#retry').onclick=()=>begin(false);$('#next').onclick=()=>{if(++pos<queue.length)render();else finish()};$('#level').onchange=$('#difficulty').onchange=update;update();
</script><script src="./learning-storage.js" data-topik-storage="1"></script><script src="./learning-bootstrap.js"></script><script src="./site-footer.js"></script></body></html>
