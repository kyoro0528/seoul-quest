['r10','주차 금지','意味として正しいものを選んでください。','차를 세우면 안 됩니다.',['차를 세워도 됩니다.','차를 세우면 안 됩니다.','차를 사야 합니다.','버스를 타면 안 됩니다.'],'駐車禁止。','주차 금지は駐車禁止です。'],

Q.forEach((x,i)=>{x.level=i<14?'1級':'2級';x.difficulty=i<8?'基礎':i<20?'標準':'応用'});const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let queue=[],pos=0,score=0,answered=false,wrong=new Set(),mode='all';function saved(){try{return new Set(JSON.parse(localStorage.getItem('topikReadingWrong')||'[]'))}catch{return new Set()}}function save(){localStorage.setItem('topikReadingWrong',JSON.stringify([...wrong]))}function send(n,p={}){if(typeof gtag==='function')gtag('event',n,p)}function selected(){return Q.filter(x=>($('#level').value==='すべて'||x.level===$('#level').value)&&($('#difficulty').value==='すべて'||x.difficulty===$('#difficulty').value))}function update(){const n=selected().length;$('#count').textContent=`${n}問が対象です`;$('#start').textContent=`${n}問を始める`;const w=saved().size;$('#review').textContent=w?`間違いを復習（${w}問）`:'間違いを復習';$('#review').disabled=!w}function begin(review=false){wrong=saved();queue=(review?Q.filter(x=>wrong.has(x[0])):selected()).map(x=>({...x,shown:shuffle(x[4])}));if(!queue.length)return;mode=review?'review':'all';pos=score=0;$('#intro').style.display='none';$('#result').classList.remove('show');$('#quiz').classList.add('show');send(review?'reading_review_start':'reading_start',{question_count:queue.length});send('practice_start',{practice_type:'reading',practice_mode:mode,content_id:'topik1_reading',question_count:queue.length});render()}function render(){answered=false;const x=queue[pos];$('#tag').textContent=`${x.level} · 読解 · ${x.difficulty}`;$('#counter').textContent=`${pos+1} / ${queue.length}`;$('#bar').style.width=`${pos/queue.length*100}%`;$('#inst').textContent=x[2];$('#question').textContent=x[1];$('#options').innerHTML='';x.shown.forEach(v=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>answer(b,v);$('#options').append(b)});$('#feedback').className='feedback';$('#next').disabled=true;$('#next').textContent=pos===queue.length-1?'結果を見る':'次の問題へ'}function answer(btn,v){if(answered)return;answered=true;const x=queue[pos],ok=v===x[3];if(ok){score++;wrong.delete(x[0])}else wrong.add(x[0]);save();[...$('#options').children].forEach(b=>{b.disabled=true;if(b.textContent===x[3])b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')});$('#judge').textContent=ok?'正解！':'不正解';$('#jp').textContent=`日本語：${x[5]}`;$('#explain').textContent=x[6];$('#feedback').className='feedback show'+(ok?'':' bad');$('#next').disabled=false;send('reading_answer',{question_id:x[0],topik_level:x.level,difficulty:x.difficulty,correct:ok});send('question_answer',{practice_type:'reading',practice_mode:mode,question_id:x[0],question_number:pos+1,answer_result:ok?'correct':'incorrect'})}function finish(){save();$('#quiz').classList.remove('show');$('#result').classList.add('show');const total=queue.length,rate=Math.round(score/total*100);$('#score').textContent=score;$('#total').textContent=` / ${total}`;$('#resultTitle').textContent=rate>=80?'よく読めています！':rate>=60?'あと一歩です':'基礎から復習しましょう';$('#resultText').textContent=`正答率${rate}%です。間違えた問題はこの端末に保存しました。`;$('#resultReview').disabled=!wrong.size;send('reading_complete',{practice_mode:mode,score,question_count:total,score_rate:rate});const result={practice_type:'reading',practice_mode:mode,score,question_count:total,score_rate:rate};send('practice_complete',result);if(total===10)send('ten_questions_complete',result)}$('#start').onclick=()=>begin(false);$('#review').onclick=$('#resultReview').onclick=()=>begin(true);$('#retry').onclick=()=>begin(false);$('#next').onclick=()=>{if(++pos<queue.length)render();else finish()};$('#level').onchange=$('#difficulty').onchange=update;update();
