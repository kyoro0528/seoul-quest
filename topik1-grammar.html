function send(name,params={}){if(typeof gtag==='function')gtag('event',name,params)}function mastered(){try{return new Set(JSON.parse(localStorage.getItem('topikGrammarMastered')||'[]'))}catch{return new Set()}}function save(set){localStorage.setItem('topikGrammarMastered',JSON.stringify([...set]))}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filters(){GROUPS.forEach(g=>{const b=document.createElement('button');b.className='filter'+(g===active?' active':'');b.textContent=g;b.onclick=()=>{active=g;filtersRefresh();render();send('grammar_filter',{grammar_group:g})};$('#filters').append(b)})}function filtersRefresh(){[...$('#filters').children].forEach(b=>b.classList.toggle('active',b.textContent===active))}
function render(){const query=$('#search').value.trim().toLowerCase(),level=$('#levelFilter').value,difficulty=$('#difficultyFilter').value,done=mastered(),rows=DATA.filter(x=>(active==='すべて'||x.g===active)&&(level==='すべて'||x.level===level)&&(difficulty==='すべて'||x.difficulty===difficulty)&&(!query||[x.f,x.m,x.r,x.ex,x.jp].join(' ').toLowerCase().includes(query)));$('#mastered').textContent=done.size;$('#list').innerHTML='';$('#empty').style.display=rows.length?'none':'block';rows.forEach(x=>{$('#list').append(card(x,done.has(x.id)))})}
function card(x,isDone){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="card-head"><span class="num">${x.id.slice(1)}</span><div><span class="group">${x.level} · ${x.field} · ${x.difficulty} · ${x.g}</span><h2 class="form">${x.f}</h2><div class="meaning">${x.m}</div></div><span class="done">${isDone?'✓':''}</span></div><div class="body"><div class="rule">${x.r}</div><p class="example" lang="ko">${x.ex}</p><div class="actions"><button class="small-btn sound">🔊 音声</button><button class="small-btn reveal">日本語訳を見る</button><button class="small-btn quiz-toggle">1問解く</button></div><p class="translation">${x.jp}</p><div class="quiz"><p lang="ko">${x.q}</p><div class="options"></div><div class="feedback"></div></div></div>`;el.querySelector('.sound').onclick=()=>speak(x);el.querySelector('.reveal').onclick=e=>{const p=el.querySelector('.translation');p.classList.toggle('show');e.currentTarget.textContent=p.classList.contains('show')?'日本語訳を隠す':'日本語訳を見る';if(p.classList.contains('show'))send('translation_reveal',{grammar_id:x.id})};el.querySelector('.quiz-toggle').onclick=()=>{const q=el.querySelector('.quiz');q.classList.toggle('show');if(q.classList.contains('show')&&!q.dataset.ready)makeQuiz(el,x)};return el}
function makeQuiz(el,x){const area=el.querySelector('.quiz'),box=el.querySelector('.options');area.dataset.ready='1';shuffle(x.o).forEach(v=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>answer(el,x,b,v);box.append(b)})}
function answer(el,x,clicked,value){const buttons=[...el.querySelectorAll('.option')],ok=value===x.a,set=mastered();ok?set.add(x.id):set.delete(x.id);save(set);buttons.forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');else if(b===clicked)b.classList.add('wrong');else b.classList.add('dim')});const f=el.querySelector('.feedback');f.textContent=ok?`正解：${x.a}`:`正解は「${x.a}」です。`;f.classList.add('show');el.querySelector('.done').textContent=ok?'✓':'';$('#mastered').textContent=set.size;send('grammar_quiz_answer',{grammar_id:x.id,grammar_group:x.g,topik_level:x.level,question_field:x.field,difficulty:x.difficulty,correct:ok})}
function speak(x){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.ex);u.lang='ko-KR';u.rate=.82;window.speechSynthesis.speak(u);send('audio_play',{content_type:'grammar',grammar_id:x.id})}
$('#search').addEventListener('input',render);$('#levelFilter').onchange=render;$('#difficultyFilter').onchange=render;filters();render();
</script><script src="./site-footer.js"></script></body></html>
