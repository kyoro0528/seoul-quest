function show(id){$$('.screen').forEach(x=>x.classList.toggle('show',x.id===id));scrollTo(0,0)}function voice(t,b){if(!('speechSynthesis'in window))return alert('音声に対応していません');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.78;let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko'));if(v)u.voice=v;b?.classList.add('playing');u.onend=u.onerror=()=>b?.classList.remove('playing');speechSynthesis.speak(u)}

function start(s,list,m){stage=s;qs=[...list];mode=m;i=points=0;miss=[];show('game');render()}function render(){locked=false;let q=qs[i],s=q.stage||stage;$('#avatar').textContent=s.avatar;$('#count').textContent=`${i+1}/${qs.length}`;$('#bar').style.width=(i/qs.length*100)+'%';$('#qKo').textContent=q.ko;$('#qKana').textContent=q.kana;$('#qJp').textContent=q.jp;$('#qJp').classList.add('hidden');$('#qSpeak').onclick=()=>voice(q.ko,$('#qSpeak'));$('#prompt').textContent='韓国語を読んで、返事を選ぼう';$('#hint').classList.remove('hidden');$('#feedback').className='feedback';let a=$('#answers');a.innerHTML='';q.choices.forEach((c,n)=>{let r=document.createElement('div'),b=document.createElement('button'),v=document.createElement('button');r.className='row';b.className='answer';b.innerHTML=`<b>${String.fromCharCode(65+n)}</b><span><div class="ko">${c[0]}</div><div class="kana">${c[1]}</div><div class="jp translation hidden">${c[2]}</div></span>`;b.onclick=()=>choose(b,c[3],q);v.className='speak';v.textContent='🔊';v.onclick=()=>voice(c[0],v);r.append(b,v);a.append(r)});$('#hint').onclick=()=>{$('#qJp').classList.remove('hidden');$$('#answers .translation').forEach(x=>x.classList.remove('hidden'));$('#prompt').textContent=q.prompt;$('#hint').classList.add('hidden')}}
function choose(b,ok,q){if(locked)return;locked=true;$$('.answer').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');$('#qJp').classList.remove('hidden');$$('#answers .translation').forEach(x=>x.classList.remove('hidden'));$('#prompt').textContent=q.prompt;$('#hint').classList.add('hidden');if(ok){points++;wrong.delete(q.id);$('#fbTitle').textContent='정답! 正解';$('#feedback').className='feedback show'}else{wrong.add(q.id);miss.push(q);$('#fbTitle').textContent='惜しい！';$('#feedback').className='feedback show bad';let n=q.choices.findIndex(c=>c[3]);$('#answers').children[n].querySelector('.answer').classList.add('ok')}$('#fbText').textContent=q.note;saveWrong()}
$('#next').onclick=()=>{if(++i<qs.length)render();else done()};function done(){last=[...qs];if(mode==='stage'){localStorage.setItem('best_'+stage.id,Math.max(best(stage),points));mark()}$('#resultTitle').textContent=mode==='review'?'復習完了':stage.name+'クリア！';$('#score').textContent=points;$('#scoreMax').textContent=' / '+qs.length;$('#resultText').textContent=points===qs.length?'完璧です。声に出して定着させましょう！':(qs.length-points)+'問が間違いノートに入りました。';$('#toReview').classList.toggle('hidden',!wrong.size);show('result')}
function key(d=new Date()){return d.toLocaleDateString('sv-SE')}function mark(){let t=key(),l=localStorage.getItem('last'),n=+(localStorage.getItem('streak')||0);if(l===t)return;let y=new Date();y.setDate(y.getDate()-1);localStorage.setItem('streak',l===key(y)?n+1:1);localStorage.setItem('last',t)}
function review(){let b=all().filter(q=>wrong.has(q.id));if(b.length)start({name:'復習',avatar:'🧑🏻‍🏫'},b,'review')}function speaking(){let p=miss.length?miss:last,q=p[Math.floor(Math.random()*p.length)]||S[0].q[0],c=q.choices.find(x=>x[3]);$('#sKo').textContent=c[0];$('#sKana').textContent=c[1];$('#sJp').textContent=c[2];$('#model').onclick=()=>voice(c[0],$('#model'));$('#playback').classList.add('hidden');$('#recStatus').textContent='タップして録音';show('speaking')}
async function record(){if(rec?.state==='recording')return rec.stop();if(!navigator.mediaDevices?.getUserMedia||!('MediaRecorder'in window))return $('#recStatus').textContent='この端末では録音できません';try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));$('#playback').src=url;$('#playback').classList.remove('hidden');$('#record').classList.remove('on');$('#record').textContent='●';$('#recStatus').textContent='再生してお手本と比べよう';stream.getTracks().forEach(t=>t.stop())};rec.start();$('#record').classList.add('on');$('#record').textContent='■';$('#recStatus').textContent='録音中…タップして停止'}catch(e){$('#recStatus').textContent='マイクを許可すると録音できます'}}
function renderVocab(cat=Object.keys(V)[0]){let tabs=$('#vocabTabs'),list=$('#wordList');tabs.innerHTML='';list.innerHTML='';Object.keys(V).forEach(k=>{let b=document.createElement('button');b.className='tab'+(k===cat?' active':'');b.textContent=k;b.onclick=()=>renderVocab(k);tabs.append(b)});V[cat].forEach(w=>{let row=document.createElement('div'),b=document.createElement('button');row.className='word';row.innerHTML=`<span><div class="ko">${w[0]}</div><div class="kana">${w[1]}</div><div class="jp">${w[2]}</div></span>`;b.className='speak';b.textContent='🔊';b.onclick=()=>voice(w[0],b);row.append(b);list.append(row)})}
$('#review').onclick=review;$('#toReview').onclick=review;$('#toSpeak').onclick=speaking;$('#record').onclick=record;$('#openVocab').onclick=()=>{renderVocab();show('vocab')};$('#vocabBack').onclick=()=>show('home');$('#gameBack').onclick=$('#toHome').onclick=$('#finishSpeak').onclick=()=>{home();show('home')};$('#speakBack').onclick=()=>show('result');home();
</script></body></html>
